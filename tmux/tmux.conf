# ─────────────────────────────────────────────────────────────
#  ~/.config/tmux/tmux.conf
# ─────────────────────────────────────────────────────────────
#  Load order:
#    1. options
#    2. keybindings
#    3. plugin declarations (@plugin) + their settings
#    4. run tpm   <- sources every plugin, keep last
#
#  Sourcing this file is ADDITIVE. Removing a line here does not
#  unset it in a running server. After removing an option, use
#  `tmux kill-server` or `tmux set -gu <option>`.
# ─────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════
#  Terminal
# ═════════════════════════════════════════════════════════════

set -g  default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"


# ═════════════════════════════════════════════════════════════
#  General
# ═════════════════════════════════════════════════════════════

set -g prefix C-b
set -g mouse on
set -g detach-on-destroy off
set -g history-limit 30000
set -g repeat-time 500

setw -g mode-keys vi
set -g  status-keys vi
set -g  status-position bottom


# ═════════════════════════════════════════════════════════════
#  Appearance
# ═════════════════════════════════════════════════════════════

set -g popup-border-lines rounded
set -g popup-border-style "fg=#54546D"


# ═════════════════════════════════════════════════════════════
#  Keybindings
# ═════════════════════════════════════════════════════════════

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# ── Pane navigation ──────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing ────────────────────────────────────────────
bind -r C-h resize-pane -L 3
bind -r C-j resize-pane -D 3
bind -r C-k resize-pane -U 3
bind -r C-l resize-pane -R 3

# ── Splits and windows inherit the current directory ─────────
bind c   new-window      -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# ── Copy mode ────────────────────────────────────────────────
# prefix + / drops straight into a backward search of scrollback
bind / copy-mode \; send-keys ?

bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Escape send -X cancel


# ═════════════════════════════════════════════════════════════
#  Plugins
# ═════════════════════════════════════════════════════════════
#  Declare only. Never `run-shell` a plugin's own .tmux file
#  here — tpm sources it below, and loading it twice appends
#  duplicate command-aliases.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# ── Theme ────────────────────────────────────────────────────
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'wave'
set -g @kanagawa-plugins "cpu-usage ram-usage"

# ── tmux-thumbs ──────────────────────────────────────────────
#  prefix + Space  → hint letters over every match
#    lowercase = copy   |   UPPERCASE = copy + paste
#    Space = multi-select   |   Esc = cancel
#
#  Do not enable @thumbs-osc52: it writes a raw escape sequence
#  to the run-shell's stdout, which tmux then displays as a
#  blank, dismissable output pane.
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-upcase-command 'echo -n {} | pbcopy; tmux set-buffer -- {}; tmux paste-buffer'
set -g @thumbs-contrast 1
set -g @thumbs-regexp-1 'https?://localhost:[0-9]+[^\s]*'


# ═════════════════════════════════════════════════════════════
#  Initialize TPM — keep last
# ═════════════════════════════════════════════════════════════

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
run '~/.config/tmux/plugins/tpm/tpm'
